name: Publish `librechat-data-provider` to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'packages/data-provider/package.json'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual publish requested'

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # VIVENTIUM START — exact release toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      # VIVENTIUM END
      - run: cd packages/data-provider && npm ci
      - run: cd packages/data-provider && npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: publish # Must match npm trusted publisher config
    steps:
      - uses: actions/checkout@v4
      # VIVENTIUM START — exact release toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: 'https://registry.npmjs.org'
      # VIVENTIUM END

      - name: Update npm for OIDC support
        run: npm install -g npm@11.13.0 # Exact project package-manager contract; supports provenance

      - run: cd packages/data-provider && npm ci
      - run: cd packages/data-provider && npm run build
      - name: Check exact published version
        id: check
        working-directory: packages/data-provider
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VERSIONS_FILE="${RUNNER_TEMP}/npm-published-versions.json"
          npm view "$PACKAGE_NAME" versions --json > "$VERSIONS_FILE"
          node ../../scripts/npm-exact-version-publish-guard.cjs \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" "$VERSIONS_FILE"
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/data-provider
        run: npm publish --provenance
