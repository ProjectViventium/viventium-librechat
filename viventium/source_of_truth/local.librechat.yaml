ocr:
  strategy: document_parser
endpoints:
  anthropic:
    titleEndpoint: anthropic
    titleModel: claude-opus-5
    titlePrompt: "Generate a concise natural conversation title from the user's request
      and the assistant's response. Do not browse, fetch, or judge URL accessibility.
      If the conversation contains a URL, title the user's intended task or outcome
      instead of whether the URL is accessible.

      Conversation: {convo}

      Return only one natural title under 40 characters."
    titlePromptTemplate: 'User: {input}

      AI: {output}'
    summarize: false
    summaryModel: claude-opus-5
    modelDisplayLabel: Azure AI Foundry (Claude)
  agents:
    order: -1
    recursionLimit: 2000
    maxRecursionLimit: 2000
    disableBuilder: false
    defaultId: agent_viventium_main_95aeb3
    iconURL: /assets/logo.svg
    # VIVENTIUM START: provider capabilities are product/config truth, not label parsing.
    providerCapabilities:
      glasshive-harness:
        label: GlassHive
        main_chat: true
        cortex_execution: true
        phase_b_followup: true
        activation_classifier: false
        realtime_voice: false
        automatic_fallback_target: true
        serial_model_fallback: true
        workspace_binding: true
        conversation_session: true
        time_context_delivery: per_turn_header
        usage_accounting_scope: visible_message_local
        context_protocol: main_context_v1
        native_session_authority: stable_authority_v1
        replay_protocol: legacy_message_count
        worker_native_tools: true
        default_access: full
        allow_full_access: true
        host_tools_transport: broker_mcp
        host_tools:
          - file_search
          - web_search
        conversation_orchestration_tools:
          - worker_delegate_once_mcp_glasshive-workers-projects
          - active_work_list
          - active_work_action
        activity_stream: true
        responses_api: false
        messaging_delivery_disposition: true
        messaging_delivery_disposition_version: 1
        excluded_mcp_servers:
          - glasshive-workers-projects
        models:
          - id: codex-cli:gpt-5.6-sol
            label: Codex / GPT-5.6 Sol
            harnessProfile: codex-cli
            effortChoices: [low, medium, high, xhigh, max, ultra]
            recommendedEffort: medium
            contextLimit: 272000
          - id: claude-code:opus
            label: Claude / Opus 5
            harnessProfile: claude-code
            effortChoices: [low, medium, high, xhigh, max]
            recommendedEffort: high
            contextLimit: 200000
    capabilityRequiredProviders:
      - glasshive-harness
    # VIVENTIUM END
    capabilities:
      - deferred_tools
      - programmatic_tools
      - file_search
      - web_search
      - artifacts
      - actions
      - context
      - tools
      - ocr
      - chain
    titlePrompt: "Generate a concise natural conversation title from the user's request
      and the assistant's response. Do not browse, fetch, or judge URL accessibility.
      If the conversation contains a URL, title the user's intended task or outcome
      instead of whether the URL is accessible.

      Conversation: {convo}

      Return only one natural title under 40 characters."
    titlePromptTemplate: 'User: {input}

      AI: {output}'
  custom:
    # VIVENTIUM START: GlassHive is a normal Agent provider backed by harness-native execution.
    - name: glasshive-harness
