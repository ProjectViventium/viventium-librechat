version: 1.3.6
cache: true
interface:
  customWelcome: Welcome to Viventium
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  runCode: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  memories: true
  temporaryChat: true
  temporaryChatRetention: 24
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  fileCitations: true
  webSearch: true
  fileSearch: true
  defaultAgent: agent_viventium_main_95aeb3
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  mcpServers:
    placeholder: Integrations
    use: true
    create: true
    share: false
    public: false
    trustCheckbox:
      label:
        en: I understand and want to continue
      subLabel:
        en: Only connect MCP servers you trust. Unreviewed servers can expose data
          or trigger unintended actions.
viventium:
  background_cortices:
    activation_format:
      response_format: "Respond with a JSON object:\n{\n  \"should_activate\": true,\n\
        \  \"confidence\": 1.0,\n  \"reason\": \"2-4 explanatory words\"\n}\n"
      brew_begin_tag: <!--viv_internal:brew_begin-->
    activation_subject_rule:
      enabled: true
      prompt:
        promptRef: cortex.background_activation_decision_subject
    activation_policy:
      enabled: true
      prompt:
        promptRef: cortex.background_activation_policy
      direct_action_mcp_servers:
        - server: glasshive-workers-projects
          owns: persistent workers, project runs, browser/desktop/local computer execution,
            worker status, and completion reports
          tool_names:
            - worker_delegate_once_mcp_glasshive-workers-projects
            - active_work_list
            - active_work_action
        - server: scheduling-cortex
          owns: reminders, scheduled follow-ups, same-conversation wakeups, delayed
            status checks, and schedule management
          tool_names:
            - sys__server__sys_mcp_scheduling-cortex
            - schedule_create_mcp_scheduling-cortex
            - schedule_get_mcp_scheduling-cortex
            - schedule_list_mcp_scheduling-cortex
            - schedule_search_mcp_scheduling-cortex
            - schedule_last_delivery_mcp_scheduling-cortex
            - schedule_update_mcp_scheduling-cortex
            - schedule_delete_mcp_scheduling-cortex
            - schedule_preview_next_mcp_scheduling-cortex
            - periphery_list_mcp_scheduling-cortex
            - periphery_read_mcp_scheduling-cortex
        - server: viventium-health
          owns: read-only local health-source capture runs, raw response records, verified
            manual images, timestamps, and integrity evidence
          tool_names:
            - sys__server__sys_mcp_viventium-health
            - health_list_runs_mcp_viventium-health
            - health_list_records_mcp_viventium-health
            - health_read_image_mcp_viventium-health
            - health_read_record_mcp_viventium-health
        - server: google-workspace
          scope_key: productivity_google_workspace
          same_scope_background_allowed: false
          owns: live Gmail, Google Calendar, Google Drive, Docs, Sheets, Slides, Chat,
            Tasks, and Workspace actions when this MCP is connected to the main agent
          tool_names:
            - sys__server__sys_mcp_google_workspace
            - search_gmail_messages_mcp_google_workspace
            - get_gmail_message_content_mcp_google_workspace
            - get_gmail_messages_content_batch_mcp_google_workspace
            - get_gmail_thread_content_mcp_google_workspace
            - list_calendars_mcp_google_workspace
            - get_events_mcp_google_workspace
            - search_drive_files_mcp_google_workspace
            - get_drive_file_content_mcp_google_workspace
            - search_docs_mcp_google_workspace
            - get_doc_content_mcp_google_workspace
            - read_sheet_values_mcp_google_workspace
            - sys__server__sys_mcp_google_workspace_2
            - search_gmail_messages_mcp_google_workspace_2
            - get_gmail_message_content_mcp_google_workspace_2
            - get_gmail_messages_content_batch_mcp_google_workspace_2
            - get_gmail_thread_content_mcp_google_workspace_2
            - list_calendars_mcp_google_workspace_2
            - get_events_mcp_google_workspace_2
            - search_drive_files_mcp_google_workspace_2
            - get_drive_file_content_mcp_google_workspace_2
            - search_docs_mcp_google_workspace_2
            - get_doc_content_mcp_google_workspace_2
            - read_sheet_values_mcp_google_workspace_2
        - server: ms365
          scope_key: productivity_ms365
          same_scope_background_allowed: false
          owns: live Outlook email, Outlook calendar, OneDrive, Excel, OneNote, Planner,
            To Do, and Microsoft 365 actions when this MCP is connected to the main
            agent
          tool_names:
            - sys__server__sys_mcp_ms-365
            - list-mail-messages_mcp_ms-365
            - get-mail-message_mcp_ms-365
            - list-mail-folder-messages_mcp_ms-365
            - list-calendar-events_mcp_ms-365
            - get-calendar-event_mcp_ms-365
            - list-folder-files_mcp_ms-365
            - download-onedrive-file-content_mcp_ms-365
            - get-excel-range_mcp_ms-365
            - search-query_mcp_ms-365
      direct_action_tool_rule: 'Connected direct-action surfaces are execution owners.
        Their presence means the main agent has the primary path; background cortices
        should stay silent unless they add separately scoped value or the matching
        direct-action surface explicitly allows same-scope supplemental background
        evidence.

        '
  no_response:
    prompt: "NO RESPONSE TAG:

      - If you have nothing meaningful to add, respond with exactly: {NTA}

      - When you use {NTA}, output ONLY that token and nothing else.

      - Never use {NTA} to hide errors/tool failures; explain the issue briefly instead.

      - Never use {NTA} to hide a new verified fact, time-sensitive blocker, tool
      completion, approval need, or meaningful change. Surface it briefly in the user's
      current channel."
  conversation_recall:
    prompt:
      promptRef: main.conversation_recall
  configVersion: 1
  primaryProvider: openai
  installMode: native
  consciousAgent:
    provider: glasshive-harness
    model: codex-cli:gpt-5.6-sol
balance:
  enabled: false
  startBalance: 200000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: days
  refillAmount: 200000
modelSpecs:
  prioritize: false
  list:
    - name: viventium
      label: Viventium
      description: The conscious self. Background cortices process in parallel, surfacing
        insights without blocking dialogue.
      default: true
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_main_95aeb3
    - name: agent_viventium_background_analysis_95aeb3
      label: Background Analysis
      description: Deep analytical processing - surfaces hidden meanings and logical
        gaps.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_background_analysis_95aeb3
    - name: agent_viventium_confirmation_bias_95aeb3
      label: Confirmation Bias
      description: Error detection - flags overconfidence and unchecked assumptions
        before they solidify.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_confirmation_bias_95aeb3
    - name: agent_viventium_red_team_95aeb3
      label: Red Team
      description: Evidence-first mistake detection - verifies claims, tests viability,
        and calls out rationalization.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_red_team_95aeb3
    - name: agent_viventium_deep_research_95aeb3
      label: Deep Research
      description: Multi-step research across sources, building comprehensive understanding.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_deep_research_95aeb3
    - name: agent_viventium_online_tool_use_95aeb3
      label: MS365
      description: Orchestrates MS365 productivity tool calls (Outlook email, calendar,
        OneDrive files).
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_online_tool_use_95aeb3
    - name: agent_viventium_parietal_cortex_95aeb3
      label: Parietal Cortex
      description: Mathematical, physics, and statistical reasoning using first-principles
        thinking.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_parietal_cortex_95aeb3
    - name: agent_viventium_pattern_recognition_95aeb3
      label: Pattern Recognition
      description: Identifies recurring themes, behavioral loops, and contradictions
        across conversation.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_pattern_recognition_95aeb3
    - name: agent_viventium_emotional_resonance_95aeb3
      label: Emotional Resonance
      description: Senses emotional undercurrents and unspoken needs that words don't
        capture.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_emotional_resonance_95aeb3
    - name: agent_viventium_strategic_planning_95aeb3
      label: Strategic Planning
      description: Transforms abstract goals into concrete action sequences with risk
        awareness.
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_strategic_planning_95aeb3
    - name: agent_viventium_support_95aeb3
      label: Viventium User Help
      description: "In-product help for using Viventium \u2014 conversations, voice,\
        \ agents, integrations, scheduling. Never mentions internal implementation;\
        \ escalates to the official Viventium support channel only when needed."
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_viventium_support_95aeb3
    - name: agent_8Y1d7JNhpubtvzYz3hvEv
      label: Google
      description: Orchestrates Google Workspace productivity tool calls
      iconURL: /assets/logo.svg
      preset:
        endpoint: agents
        agent_id: agent_8Y1d7JNhpubtvzYz3hvEv
    - name: grok-4.5
      label: Grok 4.5
      description: xAI Grok
      group: xai
      groupIcon: xai
      iconURL: xai
      preset:
        endpoint: xai
        model: grok-4.5
    - name: gemini-3-flash-preview
      label: Gemini 3 Flash
      description: Google Gemini
      group: Google
      groupIcon: /assets/google.png
      iconURL: /assets/google.png
      preset:
        endpoint: google
        model: gemini-3-flash-preview
    - name: gemini-3-pro-preview
      label: Gemini 3 Pro
      description: Google Gemini
      group: Google
      groupIcon: /assets/google.png
      iconURL: /assets/google.png
      preset:
        endpoint: google
        model: gemini-3-pro-preview
    - name: gemini-3.1-pro
      label: Gemini 3.1 Pro
      description: Google Gemini
      group: Google
      groupIcon: /assets/google.png
      iconURL: /assets/google.png
      preset:
        endpoint: google
        model: gemini-3.1-pro-preview
    - name: claude-opus-5
      label: Claude Opus 5
      description: Anthropic Direct
      group: anthropic
      groupIcon: anthropic
      iconURL: anthropic
      preset:
        endpoint: anthropic
        model: claude-opus-5
