      to: agent_viventium_reality_check_95aeb3
      description: Consult Reality Check at most once per user turn, before a consequential answer, when fresh outside-world evidence, trusted sources, relevant experience, or reference classes could materially change the answer. If its evidence or return already appears after the current user request, do not call it again; synthesize instead.
      edgeType: handoff
    - from: agent_viventium_reality_check_95aeb3
      to: agent_viventium_main_95aeb3
      description: Return Reality Check evidence to the conscious Main Agent for judgment and final synthesis.
      edgeType: handoff
    - from: agent_viventium_main_95aeb3
      to: agent_viventium_red_team_95aeb3
      description: At most once per user turn and only after Reality Check has returned, consult the existing Red Team when an important claim, plan, or decision still deserves independent adversarial pressure-testing. If its challenge or return already appears after the current user request, do not call it again; synthesize instead.
      edgeType: handoff
    - from: agent_viventium_red_team_95aeb3
