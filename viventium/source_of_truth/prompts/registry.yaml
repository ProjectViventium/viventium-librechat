schema_version: 1
prompt_root: viventium/source_of_truth/prompts
managed_scope: viventium_owned_product_prompts
notes:
  - The compiler discovers .md prompts by frontmatter id.
  - local.*.yaml source files may use promptRef; compiled runtime YAML receives plain
    strings.
  - Upstream LibreChat/user-managed prompts remain view-only unless explicitly migrated.
related_config:
  prompts:
    main.conscious_agent:
      - worker.conversation_output_contract
      - worker.conversation_output_rendering
      - worker.conversation_output_wire_projection
      - worker.grok_output_projection
      - worker.grok_output_authority
    main.tools:
      - main.native_work_input
      - worker.conversation_output_contract
      - worker.conversation_output_rendering
      - worker.conversation_output_wire_projection
      - worker.grok_output_projection
      - worker.grok_output_authority
    worker.safety_checkpoint:
      - worker.compiled_bootstrap
      - worker.native_composition
    worker.host_native_harness:
      - worker.compiled_bootstrap
      - worker.host_harness_composition
    worker.completion_contract:
      - worker.compiled_bootstrap
      - worker.native_composition
    worker.native_capability_inventory:
      - worker.compiled_bootstrap
      - worker.native_composition
    worker.grok_mcp_tool_access:
      - worker.compiled_bootstrap
      - worker.native_tool_access
      - worker.conversation_output_contract
      - worker.conversation_output_rendering
      - worker.conversation_output_wire_projection
      - worker.grok_output_projection
      - worker.grok_output_authority
    worker.conversation_file_delivery:
      - worker.compiled_bootstrap
      - worker.conversation_composition
      - worker.conversation_attachment_context
      - worker.host_mission_file_delivery
    feelings.capsule_policy:
      - feelings.numeric_kernel
      - feelings.owner_ranges
    main.user_fact_guard:
      - feelings.final_tail
    main.scheduling_self_continuity:
      - scheduling.direct_action_owner
      - scheduling.main_agent_tools
      - scheduling.mcp_server
    scheduler.run_envelope:
      - scheduler.shared_run_envelope
    scheduler.consciousness_continuity_opportunity:
      - scheduler.shared_consciousness_continuity_opportunity
    scheduler.canonical_output:
      - scheduler.canonical_output_runtime
    mcp.scheduling_cortex.server:
      - scheduling.direct_action_owner
      - scheduling.main_agent_tools
      - scheduling.mcp_server
  refs:
    main.native_work_input:
      title: Native Queen Current Work Input
      summary: The existing work-action schema exposes exact native clarification answers and offered single-operation permission choices; server input provenance and the native owner preserve request authority.
      path: viventium_v0_4/LibreChat/packages/api/src/glasshive/conversationOrchestration.ts
      selector: ACTIVE_WORK_ACTION_JSON_SCHEMA
      source: native.current_work_input_contract
    worker.conversation_output_contract:
      title: Native Conversation Final Result Contract
      summary: The code-owned schema describes the final host-graph envelope. Authorized native functions and MCP calls execute through their own protocol before the final result; the parser validates assistant and transfer control pairs.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/agent_builder_control.py
      selector: conversation_output_schema
      source: worker.compiled_prompt_contract
    worker.conversation_output_rendering:
      title: Native Final Contract Rendering
      summary: One deterministic renderer turns the declared final-result schema into native authority text; streaming and final validation consume the same schema.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/agent_builder_control.py
      selector: conversation_output_contract_instructions
      source: worker.compiled_prompt_contract
    worker.grok_output_projection:
      title: Grok Final Result Schema Projection
      summary: Both host and container adapters declare disjoint assistant and graph-transfer controls. Enabled-tool conversations carry that contract in native system authority and a minimal typed wire constraint; restricted conversations keep their original native constrained metadata. Other native adapters retain their supported schema shape.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/grok_runtime.py
      selector: _grok_conversation_output_schema
      source: worker.compiled_prompt_contract
    worker.conversation_output_wire_projection:
      title: Native Conversation Wire Constraint
      summary: The sampler receives only the existing object fields, types, enums and required fields. The complete declared schema and parser retain graph and delivery authority; wire and declared hashes are separate.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/agent_builder_control.py
      selector: minimal_conversation_output_schema
      source: worker.compiled_prompt_contract
    worker.grok_output_authority:
      title: Grok Native Final Contract Authority
      summary: The admitted native-tool-enabled conversation carries the code-owned final-result protocol before its pinned authority tail. Declared controls remain in streaming and final parsing; the sampler receives the minimal typed projection.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/grok_runtime.py
      selector: grok_native_authority_instructions
      source: worker.compiled_prompt_contract
    worker.native_tool_access:
      title: Native Profile MCP Tool Access
      summary: The registered profile fact reaches Worker rules and conversation System instructions only when the existing native MCP projection is nonempty and native tools are enabled; the exact final authority tail stays last.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/bootstrap.py
      selector: native_profile_tool_access_instructions
      source: worker.compiled_prompt_contract
    worker.conversation_composition:
      title: Host-Native Conversation File Delivery
      summary: Host conversation authority adds the registered local-file handoff contract after signed profile instructions and before the pinned Feeling tail; Docker and mission composition retain their own contracts.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/conversation_provider.py
      selector: _conversation_file_delivery_instructions
      source: worker.compiled_prompt_contract
    worker.host_mission_file_delivery:
      title: Host-Native Mission File Delivery
      summary: Native host missions with declared artifact file transport compose the same registered local-file selection contract before their command and stdin. Conversation, restricted and deferred provider paths retain their existing contracts.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/profile_runtime.py
      selector: _host_mission_instruction
      source: worker.compiled_prompt_contract
    worker.conversation_attachment_context:
      title: Conversation Attachment Selection Context
      summary: The current accepted-turn context carries the selected public upload ledger and ordered workspace paths. File identity and kind remain structured metadata; storage paths and grants remain private.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/conversation_provider.py
      selector: _request_attachment_context
      source: worker.compiled_prompt_contract
    worker.host_harness_composition:
      title: Host Worker Harness Frame
      summary: The host file producer consumes the registered frame with current operating, capability, completion and safety text in the existing order.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/profile_runtime.py
      selector: _host_harness_prompt
      source: worker.compiled_prompt_contract
    worker.compiled_bootstrap:
      title: xPerfect Compiled Worker Instructions
      summary: Managed Viventium loads the required compiled worker sources; standalone xPerfect retains its explicit compatibility defaults.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/bootstrap.py
      selector: _worker_prompt
      source: worker.compiled_prompt_contract
    worker.native_composition:
      title: Host And Sandbox Worker Composition
      summary: Existing harness, project and run instruction producers consume the same resolved completion and capability text.
      path: viventium_v0_4/xPerfect/runtime_phase1/src/workers_projects_runtime/profile_runtime.py
      selector: _instruction_with_completion_contract
      source: worker.compiled_prompt_contract
    feelings.numeric_kernel:
      title: Feeling State And Capsule Structure
      summary: Nine bands retain numeric defaults, range selection, endpoint requirements and strongest eligible moderate pulls; compiled policy supplies their semantic text.
      path: viventium_v0_4/LibreChat/packages/api/src/feelings/kernel.ts
      selector: buildFeelingCapsule
      source: feelings.kernel
    feelings.owner_ranges:
      title: Owner Feeling Range Additions
      summary: Authenticated owner additions remain private state and follow the selected compiled default without changing numeric state.
      path: viventium_v0_4/LibreChat/api/server/routes/viventium/feelings.js
      selector: /bands/:bandId
      source: feelings.owner_settings
    feelings.final_tail:
      title: Final Fact Guard And Pinned Feeling
      summary: The compiled fact guard precedes one exact request-pinned capsule at the final instruction boundary.
      path: viventium_v0_4/LibreChat/api/server/services/viventium/feelingPromptTail.js
      selector: buildViventiumDynamicTail
      source: feelings.final_instruction_layer
    scheduling.direct_action_owner:
      title: Scheduling Direct-Action Owner
      summary: Scheduling Cortex is the direct-action owner for reminders, follow-ups, wakeups, delayed checks, and schedule management.
      path: local.viventium-agents.yaml
      selector: config.viventium.background_cortices.activation_policy.direct_action_mcp_servers[scheduling-cortex]
      source: agents.direct_action_mcp_server
      server: scheduling-cortex
    scheduling.main_agent_tools:
      title: Main Agent Scheduling Tools
      summary: The conscious agent can create, inspect, update, delete, and preview schedules through Scheduling Cortex.
      path: local.viventium-agents.yaml
      selector: mainAgent.tools[scheduling-cortex]
      source: agents.main_agent_tools
      server: scheduling-cortex
    scheduling.mcp_server:
      title: Scheduling MCP Server
      summary: LibreChat connects to the local Scheduling Cortex MCP as a trusted server-instructions source.
      path: local.librechat.yaml
      selector: mcpServers.scheduling-cortex
      source: librechat.mcp_server
      server: scheduling-cortex
    scheduler.shared_run_envelope:
      title: Shared Scheduled Run Envelope
      summary: Registry-owned generic scheduler wrapper and deterministic factual run context contract.
      path: viventium_v0_4/shared/scheduler_prompt_contract.py
      selector: render_scheduler_run_envelope
      source: scheduler.shared_prompt_contract
    scheduler.shared_consciousness_continuity_opportunity:
      title: Consciousness Continuity Opportunity
      summary: General all-feelings orientation, appraisal, choice, action, observation, and reappraisal opportunity.
      path: viventium_v0_4/shared/scheduler_prompt_contract.py
      selector: CONSCIOUSNESS_CONTINUITY_OPPORTUNITY_PROMPT_ID
      source: scheduler.shared_prompt_contract
    scheduler.canonical_output_runtime:
      title: Scheduled Canonical Output
      summary: One channel-neutral scheduled result for downstream adapters and intentional silence.
      path: viventium_v0_4/LibreChat/api/server/services/viventium/surfacePrompts.js
      selector: buildScheduledCanonicalOutputInstructions
      source: scheduler.canonical_output_contract
